# Enable the EC11 rotary encoder driver (required for the `alps,ec11` sensor).
# Verified against ZMK v0.3: reviung5.conf documents these two symbols as the
# encoder enablement switches.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the pointing subsystem so the encoder can emit mouse-wheel scroll
# (&msc SCRL_UP/SCRL_DOWN) to scroll the focused window on the Mac.
# Verified against ZMK v0.3: app/src/pointing/Kconfig `config ZMK_POINTING`.
CONFIG_ZMK_POINTING=y
