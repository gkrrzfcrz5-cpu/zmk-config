# Enable the EC11 rotary encoder driver (required for the `alps,ec11` sensor).
# Verified against ZMK v0.3: reviung5.conf documents these two symbols as the
# encoder enablement switches.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the pointing subsystem so the encoder can emit mouse-wheel scroll
# (&msc SCRL_UP/SCRL_DOWN) to scroll the focused window on the Mac.
# Verified against ZMK v0.3: app/src/pointing/Kconfig `config ZMK_POINTING`.
CONFIG_ZMK_POINTING=y

# Phase 4: enable the OLED status display.
# Verified against ZMK v0.3 app/src/display/Kconfig: `menuconfig ZMK_DISPLAY`
# selects DISPLAY + LVGL and defaults to the built-in status screen. The
# SSD1306 driver + I2C turn on automatically from the `solomon,ssd1306fb`
# devicetree node (drivers/display/Kconfig.ssd1306 is `default y` when
# DT_HAS_SOLOMON_SSD1306FB_ENABLED). LVGL mono settings mirror the official
# corne/kyria Kconfig.defconfig for a 1bpp OLED (LV_COLOR_DEPTH_1 triggers the
# mono theme so text renders correctly).
CONFIG_ZMK_DISPLAY=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# Phase 4b: replace the built-in ZMK status screen with our custom 12-screen UI.
# Verified against ZMK v0.3 app/src/display/Kconfig: STATUS_SCREEN is a `choice`,
# so selecting CUSTOM auto-deselects BUILT_IN (no duplicate status-screen symbol).
# ZMK then calls our zmk_display_status_screen() (src/status_screen.c).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CUSTOM screen pulls in none of ZMK's widgets/fonts, so enable the LVGL pieces
# our screen uses. ZMK's display implies LV_CONF_MINIMAL, which defaults most of
# these off. Fonts: montserrat 10/12/14 (default 12); widgets: label + bar.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# CRITICAL for 1bpp panels: enable the LVGL mono theme. ZMK only `imply`s
# LV_USE_THEME_MONO under the BUILT_IN status screen (display/Kconfig L44), so
# selecting the CUSTOM screen LOSES it — then LVGL renders with the default
# COLOUR theme (anti-aliasing / partial opacities) into the 1-bit framebuffer
# and the whole screen comes out as garbage/noise. Turning it on makes ZMK's
# initialize_theme() call lv_theme_mono_init() (quantises everything to pure
# black/white), which is what the SSD1306 needs. If the result is inverted,
# add CONFIG_ZMK_DISPLAY_INVERT=y (one-line flip).
CONFIG_LV_USE_THEME_MONO=y

# Prototype demo: the 12 states auto-cycle on a timer, so keep the panel lit
# instead of blanking on idle (ZMK defaults BLANK_ON_IDLE=y for the SSD1306).
# Revisit for the battery design later.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
