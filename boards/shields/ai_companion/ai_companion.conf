# Enable the EC11 rotary encoder driver (required for the `alps,ec11` sensor).
# Verified against ZMK v0.3: reviung5.conf documents these two symbols as the
# encoder enablement switches.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the pointing subsystem so the encoder can emit mouse-wheel scroll
# (&msc SCRL_UP/SCRL_DOWN) to scroll the focused window on the Mac.
# Verified against ZMK v0.3: app/src/pointing/Kconfig `config ZMK_POINTING`.
CONFIG_ZMK_POINTING=y

# Phase 4: enable the OLED status display.
# Verified against ZMK v0.3 app/src/display/Kconfig: `menuconfig ZMK_DISPLAY`
# selects DISPLAY + LVGL and defaults to the built-in status screen. The
# SSD1306 driver + I2C turn on automatically from the `solomon,ssd1306fb`
# devicetree node (drivers/display/Kconfig.ssd1306 is `default y` when
# DT_HAS_SOLOMON_SSD1306FB_ENABLED). LVGL mono settings mirror the official
# corne/kyria Kconfig.defconfig for a 1bpp OLED (LV_COLOR_DEPTH_1 triggers the
# mono theme so text renders correctly).
CONFIG_ZMK_DISPLAY=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
