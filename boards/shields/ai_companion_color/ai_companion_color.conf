# Enable the EC11 rotary encoder driver (required for the `alps,ec11` sensor).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the pointing subsystem so the encoder can emit mouse-wheel scroll
# (&msc SCRL_UP/SCRL_DOWN) to scroll the focused window on the Mac.
CONFIG_ZMK_POINTING=y

# ---- Colour display: Waveshare 1.9" ST7789V2 (170x320, 4-wire SPI) ----
# CONFIG_ZMK_DISPLAY=y selects DISPLAY + LVGL. The ST7789V driver turns on
# automatically from the `sitronix,st7789v` devicetree node
# (drivers/display/Kconfig.st7789v is `default y` when
# DT_HAS_SITRONIX_ST7789V_ENABLED, and `select SPI`), but we set it + SPI + the
# RGB565 pixel format explicitly for clarity.
CONFIG_ZMK_DISPLAY=y
CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

# LVGL colour settings (contrast with the mono shield's 1bpp / mono theme):
# 16-bit colour depth = RGB565, matching the panel's colmod 0x05. VDB is sized
# as a PERCENTAGE of the display buffer (Zephyr lvgl module); 16% of
# 170x320x2B (~108 KB) is ~17 KB — LVGL partial-renders, so no full framebuffer
# is held (a full 16bpp buffer would be too large to double-buffer in RAM).
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_DPI_DEF=148

# Swap the 2 bytes of each RGB565 pixel. The ST7789 takes pixels over SPI MSB
# first; LVGL stores RGB565 little-endian, so without this the two bytes arrive
# reversed. Pure white/black are byte-swap invariant (all 1s / all 0s) so they
# still look right, but every intermediate colour — including the anti-aliased
# grey edges of white text — maps to a wrong hue, showing up as red/blue colour
# fringing around the glyphs. This flag fixes that. (LVGL Kconfig help: "Useful
# if the display has an 8-bit interface (e.g. SPI).")
CONFIG_LV_COLOR_16_SWAP=y

# Replace the built-in ZMK status screen with our custom 12-screen UI
# (src/status_screen.c). This screen is currently laid out for the 128x64 mono
# panel, so on the 170x320 colour panel it will render top-left and small until
# the layout is reworked for colour — but it builds and shows content.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL pieces our screen uses. Colour uses LVGL's default theme (no mono theme).
# Larger Montserrat sizes so text fills the 170x320 panel instead of the tiny
# 10/12/14 the 128x64 mono OLED used (src/status_screen.c picks these via the
# AIC_F_* macros when CONFIG_LV_COLOR_DEPTH_16 is set).
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y

# LV_USE_ARC = curved shapes (the mascot's smile / closed happy-eyes / frown are
# drawn as arc segments so the face reads as friendly instead of a stiff grid of
# rectangles). LV_USE_METER = the boot splash's outer tick ring (a meter scale of
# ~48 white radial ticks that slowly rotates; src/status_screen.c aic_boot_splash).
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_METER=y
# LV_USE_LINE = the mascot's angled strokes (worried eyebrows, celebrate sparks,
# alert burst rays) — straight segments a plain rectangle can't make.
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y

# Colour glyph draw buffers need more LVGL heap than the mono 4096. (The mono
# shield restores 4096 to match the built-in screen; colour rendering allocates
# larger draw buffers, so give it more headroom.)
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Prototype demo: keep the panel lit (the 12 states auto-cycle on a timer).
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# USB CDC-ACM data channel (host <-> device, newline-delimited JSON) — identical
# to the mono shield.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

# Compile our host-communication module (src/aic_comm.c).
CONFIG_AIC_COMM=y

# ---- Backlight on P1.05 (D18), driven by PWM0 ----
# BL is a logic pin on the panel's TXS0108 level-shifter, so PWM on P1.05 gives
# real on/off (and future brightness) control instead of the stray-pull-up
# "always on". ZMK backlight defaults: on at boot, 100%. LED/LED_PWM/PWM are
# normally auto-selected from the pwm-leds node; set explicitly to be safe.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ---- Transport policy: USB-preferred, BLE auto-fallback (both compiled in) ----
# The connection story for this device, stated explicitly so it is readable from
# the shield config instead of inferred from the board fragment.
#
# Both HID transports are active:
#   - USB  : CONFIG_ZMK_USB=y (above) — the active HID endpoint whenever a USB
#            host is enumerated. It is ALSO the only channel for the aic_comm
#            data link (CDC-ACM screen-state push + button-input reports), so a
#            plugged device gets the full UI; see src/aic_comm.c.
#   - BLE  : CONFIG_ZMK_BLE=y — HID over GATT, advertised as the keyboard name
#            "AI Companion C" (Kconfig.defconfig). Used automatically when no USB
#            host is present; bonds persist via CONFIG_SETTINGS.
# ZMK's endpoint logic already auto-selects USB when connected and falls back to
# BLE when unplugged (no manual &out toggle is bound), which is the intended
# behaviour: tethered = full screen+keys, untethered = keys/⌘M only until the
# wireless data link (BT_NUS, deferred) carries screen state over BLE too.
#
# Both symbols are already =y from the board fragment
# (app/boards/seeeduino_xiao_ble.conf); ZMK_BLE also auto-selects SETTINGS. We
# restate them here purely as a self-documenting statement of intent — the built
# firmware is byte-identical with or without these two lines (same rationale as
# config/tester_xiao.conf).
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ---- Soft off (真·關機 / complete shutdown) ----
# The deepest power state: the nRF52840 enters System OFF (not just idle/deep
# sleep) when the user HOLDS Yes+Open ~1.5s (a combo bound to &soft_off in the
# keymap). Current draw drops to ~µA, so a charged battery lasts months. The
# device wakes by pressing ANY face/encoder key — kscan0 is listed in the
# shield's `zmk,soft-off-wakeup-sources` node (ai_companion_color.overlay), and
# because kscan0 already carries `wakeup-source;` this is the simplest wake path
# (the ZMK docs' "add your kscan to wakeup-sources" shortcut for a direct kscan).
#
# HARDWARE NOTE: the backlight (BL on P1.05) will NOT go dark on the CURRENT
# board while soft-off'd — in System OFF the pin floats and the panel's TXS0108
# internal pull-up re-lights it. A ~10kΩ pulldown BL->GND (planned for the next
# PCB spin) fixes that. Until then the CHIP still powers down for real (BLE/USB
# drop, wake-on-keypress works); only the screen stays visually lit.
CONFIG_ZMK_PM_SOFT_OFF=y
