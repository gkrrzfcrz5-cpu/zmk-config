# Enable BLE + settings persistence for the tester build.
#
# tester_xiao's Kconfig.defconfig hard-defaults ZMK_BLE=n and SETTINGS=n (it is a
# USB-only diagnostic). A user config fragment (this file, config/<shield>.conf)
# is merged as *user* config and overrides those defconfig DEFAULTS — unlike
# `-DCONFIG_*` cmake args, which do NOT override a Kconfig.defconfig def_bool.
#
# ZMK_BLE `imply`s SETTINGS/BT_SETTINGS; we still set SETTINGS explicitly so it
# wins against tester_xiao's def_bool n regardless of Kconfig default ordering.
# Verified against ZMK v0.3 app/Kconfig (menuconfig ZMK_BLE: imply SETTINGS).
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y
