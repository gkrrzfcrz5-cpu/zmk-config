# Kconfig overrides for the `tester_xiao` shield build.
#
# NOTE (verified 2026-09-27 by decoding the flashed .uf2):
# BLE is ALREADY enabled for this board+shield combo *without* this file. The
# board-level fragment app/boards/seeeduino_xiao_ble.conf (auto-loaded by Zephyr
# for the seeeduino_xiao_ble board) sets CONFIG_ZMK_BLE=y and CONFIG_ZMK_USB=y,
# and that fragment wins over the tester_xiao shield's Kconfig.defconfig
# `def_bool n`. Evidence: the built firmware links the Nordic BLE link-layer
# controller (zephyr/subsys/bluetooth/controller/ll_sw/nordic/) and exposes the
# BLE HID (GATT) device name "ZMK Tester".
#
# We keep these lines as an explicit, self-documenting statement of intent. They
# are redundant with the board fragment (the firmware is byte-identical with or
# without this file), NOT the thing that turns BLE on.
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y
