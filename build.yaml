# This file generates the GitHub Actions build matrix.
#
# Verified against ZMK v0.3.0 source (commit edf5c08, Zephyr v3.5.0+zmk-fixes):
#   - Board  `seeeduino_xiao_ble`  -> app/boards/arm/seeeduino_xiao_ble/seeeduino_xiao_ble.zmk.yml
#                                     (id: seeeduino_xiao_ble, exposes: [seeed_xiao], outputs: usb, ble)
#   - Shield `tester_xiao`         -> app/boards/shields/tester_xiao/ (requires: [seeed_xiao])
#
# NOTE: The Zephyr 3.6+ "board//variant" target syntax (e.g. `xiao_ble//zmk`) does
# NOT exist on ZMK v0.3 / Zephyr 3.5. `seeeduino_xiao_ble` is the correct, verified id.
#
# BLE is enabled automatically by the board-level fragment
# app/boards/seeeduino_xiao_ble.conf (CONFIG_ZMK_BLE=y, auto-loaded by Zephyr),
# which wins over tester_xiao's Kconfig.defconfig `def_bool n`. Verified by
# decoding the .uf2: it links the Nordic BLE controller + GATT HID. The resulting
# firmware does BOTH: USB HID GPIO test (short D0..D10 to GND -> types "PIN <n>")
# AND advertises as a BLE HID keyboard ("ZMK Tester") for pairing with the Mac.
# (config/tester_xiao.conf restates ZMK_BLE=y for documentation; it is redundant.)
---
include:
  - board: seeeduino_xiao_ble
    shield: tester_xiao
    artifact-name: seeeduino_xiao_ble-tester_xiao-ble
  # Phase 3: custom AI Companion shield (4 buttons + EC11 encoder + push).
  # Same board -> also BLE-enabled + USB HID. Test keycodes: V/Y/N/O + vol/mute.
  - board: seeeduino_xiao_ble
    shield: ai_companion
    artifact-name: seeeduino_xiao_ble-ai_companion
